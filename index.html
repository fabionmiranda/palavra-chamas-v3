        font-family: 'Playfair+Display', serif;

      @keyframes flame-pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); filter: brightness(1); }
        50% { opacity: 1; transform: scale(1.01); filter: brightness(1.2); }
      }
      .animate-flame {
        animation: flame-pulse 2s infinite ease-in-out;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .animate-float {
        animation: float 5s infinite ease-in-out;
      }
      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .text-fire {
        background: linear-gradient(to right, #fbbf24, #f59e0b, #ea580c, #dc2626);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .text-glow {
        text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      }
      section {
        width: 100%;
        display: flex;
